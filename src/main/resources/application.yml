env:
  otlp:
    enabled: false
    endpoint:
      scheme: http
      host: localhost
      port-rest: 4318
      port-grpc: 4317

logging.level:
  org.springframework: info
    #transaction: info
    #security: trace
    #context.support.ResourceBundleMessageSource: DEBUG

spring:
  application:
    name: rms-application
  messages:
    basename: fw-messages,application-messages
    encoding: UTF-8
  profiles:
    group:
      jpa-all: item-jpa,reservation-jpa,user-jpa
      file-all: item-file,reservation-file,user-file
    default: jpa-all
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      javax.persistence.validation.mode: NONE
  mvc:
    format:
      date: yyyyMMdd
      date-time: yyyyMMdd HH:mm

management:
  info:
    java.enabled: true
    os.enabled: true
    process.enabled: true    
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: "env,beans"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db,dependentServers"
      validate-group-membership: false # groupにindicatorが存在しない場合もエラーにしない設定
      
  # =======
  # ＜TelemetryパイプラインはOTEL+HTTPの標準的な構成＞
  # metrics(micrometer-registry-otlp) ------------(HTTP)--┐                ┌-- (http://prometheus:9090/api/v1/otlp) -> Prometheus/otlp-receiver
  # tracing(micrometer-tracing-bridge-otel) ------(gRPC)--├--> collector --┤-- (http://tempo:4418) ------------------> Grafana Tempo
  # logging(opentelemetry-logback-appender-1.0) --(gRPC)--┘                └-- (http://loki:3100/otlp) --------------> Grafana Loki
  # =======
  metrics:
    tags:
      application: ${spring.application.name}
      instance: "host.docker.internal:8080"
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0  # 100%サンプリング（開発環境向け）
  otlp:
    metrics:
      export:
        enabled: ${env.otlp.enabled}
        url: ${env.otlp.endpoint.scheme}://${env.otlp.endpoint.host}:${env.otlp.endpoint.port-rest}/v1/metrics # MicrometerはgRPCは未サポート
        step: 2s
    tracing:
      export:
        enabled: ${env.otlp.enabled}
      transport: grpc
      endpoint: ${env.otlp.endpoint.scheme}://${env.otlp.endpoint.host}:${env.otlp.endpoint.port-grpc} # for gRPC
    logging:
      export:
        enabled: ${env.otlp.enabled}
      transport: grpc
      endpoint: ${env.otlp.endpoint.scheme}://${env.otlp.endpoint.host}:${env.otlp.endpoint.port-grpc} # for gRPC
     
      
rms:
  log:
    server:
      enable: false
  jwt-encode:
    enable: true
    private-key: classpath:/jwt.key
    clock:
      type: SYSTEM
      fixed-datetime: 2024-01-01T12:30 # typeがSYSTEMの場合は無視される
    claim:
      issuer: JsonWebTokenIntegrationTest
      exp: 60                 # 有効期限（分単位）
  jwt-deencode:
    public-key: classpath:/jwt.pub.key
    claim:
      issuer: ${rms.jwt-encode.claim.issuer}
  health:
    depend-services:
      - http://localhost:8081/actuator/health/readiness
  rest:
    controller:
      format:
        date: ${spring.mvc.format.date}
        date-time: ${spring.mvc.format.date-time}
  persistence:
    item:
      csv:
        type: temporary
        temporary:
          resource: temporary/itemTemp.csv
      sql:
        schema-locations: classpath:sql/item-schema.sql
        data-locations: classpath:sql/item-data.sql
      remote:
        url: http://localhost:${local.server.port}/remote
        format:
          date: ${spring.mvc.format.date}
          date-time: ${spring.mvc.format.date-time}
    reservation:
      csv:
        type: temporary
        temporary:
          resource: temporary/reservationTemp.csv
      sql:
        schema-locations: classpath:sql/reservation-schema.sql
        data-locations: classpath:sql/reservation-data.sql
      remote:
        url: http://localhost:${local.server.port}/remote
        format:
          date: ${spring.mvc.format.date}
          date-time: ${spring.mvc.format.date-time}
    user:
      csv:
        type: temporary
        temporary:
          resource: temporary/userTemp.csv
      sql:
        schema-locations: classpath:sql/user-schema.sql
        data-locations: classpath:sql/user-data.sql
      remote:
        url: http://localhost:${local.server.port}/remote
        format:
          date: ${spring.mvc.format.date}
          date-time: ${spring.mvc.format.date-time}
